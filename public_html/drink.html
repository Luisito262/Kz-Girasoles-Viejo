	<script>
		
		// Deshabilitar clic derecho
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Deshabilitar F12
        document.addEventListener('keydown', function(event) {
            if (event.keyCode == 123) { // F12
                event.preventDefault();
            } else if (event.ctrlKey && event.shiftKey && event.keyCode == 73) { // Ctrl+Shift+I                
                event.preventDefault();
            } else if (event.ctrlKey && event.shiftKey && event.keyCode == 67) { // Ctrl+Shift+C
                event.preventDefault();
            } else if (event.ctrlKey && event.shiftKey && event.keyCode == 74) { // Ctrl+Shift+J
                event.preventDefault();
            } else if (event.ctrlKey && event.keyCode == 85) { // Ctrl+U
                event.preventDefault();
            }
        }, false);


		function llenarListaBebida() {
			var html = '';	
			$.each(restaurante.bebida, function (i, item) {	
				html += '<div style="background-image: url('+"'"+item.imagen+"'"+'); background-size: 100% 100%;" class="menu_list">';
				html += '	<div style="background-color: rgba(255, 255, 255, 0.5);" class="bg_opacidad">';
				html += '		<h1>'+item.grupo+'</h1>';
				html += '		<ul class="list">';
				$.each(item.productos, function (j, producto) {						
					html += '		<li>';
					html += '			<h4>';
					html += '				'+producto.nombre+'';
					html += '				<span>$'+((producto.precio != null) ? producto.precio : "")+'</span>';
					html += '			</h4>';
					html += '			<p>'+producto.descripcion+'</p>';
					html += '		</li>';																					
				});
				html += '		</ul>';
				html += '	</div>';	
				html += '</div>';//end menu_list

			});	
			
			html += '<div class="blog_post">';
			html += '	<img src="img/guayabo.png" alt="">';
			html += '	<div class="blog_details">';
			html += '		<a><h2>Guayabo? eso no es problema!</h2></a>';
			html += '       <p>Tenemos aspirina, sal de frutas, electrolite y mucho más.</p>';
			html += '	</div>';
			html += '</div>';
			
			$('#listado').append(html);				

		}

        function initializetor () {
            llenarListaBebida();
        }
        $( document ).ready( initializetor );
	</script>
